
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axons Auto | Premium Cars</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #172033;
}

header {
  background: #101827;
  color: white;
  padding: 22px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.logo {
  font-size: 26px;
  font-weight: 800;
}

.logo span { color: #4285ff; }

header p {
  color: #cbd5e1;
  margin-top: 5px;
  font-size: 13px;
}

.hero {
  background: linear-gradient(120deg,#101827,#263f65);
  color: white;
  padding: 65px 6%;
}

.hero h1 {
  font-size: clamp(32px,5vw,48px);
  margin-bottom: 14px;
}

.hero p {
  color: #cbd5e1;
  font-size: 16px;
}

.container {
  padding: 40px 6%;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.heading h2 { font-size: 27px; }

#count { color: #6b7280; }

.filters {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 12px;
  margin: 25px 0;
}

input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #dce1e9;
  border-radius: 9px;
  background: white;
  font-size: 14px;
}

.car-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 24px;
}

.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 22px #0000000d;
  transition: .25s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 30px #00000017;
}

.photo-wrap { position: relative; }

.car-image {
  width: 100%;
  height: 225px;
  object-fit: cover;
  display: block;
  background: #e5e7eb;
}

.status {
  position: absolute;
  top: 14px;
  left: 14px;
  background: #dcfce7;
  color: #166534;
  padding: 8px 12px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: bold;
}

.details { padding: 19px; }

.car-name {
  font-size: 20px;
  margin-bottom: 9px;
}

.price {
  color: #1769ff;
  font-size: 25px;
  font-weight: 800;
}

.specs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 17px 0;
}

.specs span {
  background: #f1f4f8;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 12px;
  color: #596579;
}

.actions {
  display: flex;
  gap: 9px;
}

.btn {
  flex: 1;
  padding: 12px 8px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

.view {
  background: #edf2ff;
  color: #1755c5;
}

.enquire {
  background: #1769ff;
  color: white;
}

.empty {
  grid-column: 1/-1;
  background: white;
  text-align: center;
  padding: 50px;
  border-radius: 12px;
  color: #6b7280;
}

footer {
  background: #101827;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

footer p {
  color: #aebbd0;
  margin-top: 8px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99;
  background: #000b;
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal.show { display: flex; }

.modal-content {
  background: white;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 25px;
  border-radius: 15px;
  position: relative;
}

.modal-content img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 10px;
}

.modal-content h2 { margin: 16px 0; }

.modal-content p { margin: 10px 0; }

.close {
  position: absolute;
  right: 20px;
  top: 15px;
  font-size: 27px;
  background: white;
  border: none;
  cursor: pointer;
}

@media(max-width:900px) {
  .car-grid { grid-template-columns: repeat(2,1fr); }
}

@media(max-width:600px) {
  .car-grid { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr; }
  .hero { padding: 45px 6%; }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">AXONS <span>AUTO</span></div>
    <p>Premium Cars. Trusted Deals.</p>
  </div>
  <div>PRE-OWNED CAR COLLECTION</div>
</header>

<section class="hero">
  <h1>Find Your Perfect Drive.</h1>
  <p>Explore our exclusive collection of premium cars.</p>
</section>

<main class="container">

  <div class="heading">
    <h2>Available Cars</h2>
    <span id="count"></span>
  </div>

  <div class="filters">
    <input id="search" placeholder="Search car brand or model...">

    <select id="fuel">
      <option value="">All Fuel Types</option>
      <option>Petrol</option>
      <option>Diesel</option>
      <option>Electric</option>
      <option>Hybrid</option>
    </select>

    <select id="sort">
      <option value="">Sort by Price</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>

  <div class="car-grid" id="carGrid"></div>

</main>

<footer>
  <h2>AXONS AUTO</h2>
  <p>Premium Cars. Trusted Deals.</p>
  <p>Contact us for availability and test drives.</p>
</footer>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>

// YOUR WHATSAPP NUMBER
// Replace with your actual number including country code.

const WHATSAPP_NUMBER = "91XXXXXXXXXX";

// CAR INVENTORY
// Replace demo cars with your actual inventory.

const cars = [

{
  id: 1,
  brand: "BMW",
  model: "X5 xDrive",
  year: 2025,
  price: 8500000,
  km: 12000,
  fuel: "Petrol",
  transmission: "Automatic",
  color: "Black",
  image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=1000",
  status: "Available",
  description: "Premium luxury SUV. Contact us for more details."
},

{
  id: 2,
  brand: "Mercedes-Benz",
  model: "E-Class",
  year: 2024,
  price: 7200000,
  km: 18000,
  fuel: "Petrol",
  transmission: "Automatic",
  color: "White",
  image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=1000",
  status: "Available",
  description: "Luxury sedan. Contact us for more details."
},

{
  id: 3,
  brand: "Porsche",
  model: "911 Carrera",
  year: 2023,
  price: 14500000,
  km: 9000,
  fuel: "Petrol",
  transmission: "Automatic",
  color: "Silver",
  image: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1000",
  status: "Available",
  description: "Performance sports car. Contact us for more details."
}

];

const grid = document.getElementById("carGrid");

function money(value) {
  return "₹ " + value.toLocaleString("en-IN");
}

function whatsappLink(car) {
  const message =
    `Hi Axons Auto! I am interested in ${car.brand} ${car.model} (${car.year}), listed at ${money(car.price)}. Please share more details.`;

  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
}

function renderCars() {

  const query = document.getElementById("search").value.toLowerCase();
  const fuel = document.getElementById("fuel").value;
  const sort = document.getElementById("sort").value;

  let results = cars.filter(car => {

    const matchesSearch =
      `${car.brand} ${car.model} ${car.year}`.toLowerCase().includes(query);

    const matchesFuel = !fuel || car.fuel === fuel;

    return matchesSearch && matchesFuel && car.status === "Available";

  });

  if (sort === "low") {
    results.sort((a,b) => a.price-b.price);
  }

  if (sort === "high") {
    results.sort((a,b) => b.price-a.price);
  }

  document.getElementById("count").textContent =
    results.length + " cars available";

  if (!results.length) {
    grid.innerHTML = `<div class="empty">No matching cars found.</div>`;
    return;
  }

  grid.innerHTML = results.map(car => `

    <article class="card">

      <div class="photo-wrap">
        <img class="car-image"
          src="${car.image}"
          alt="${car.brand} ${car.model}"
          onerror="this.src='https://placehold.co/800x500?text=Car+Photo'">

        <span class="status">${car.status}</span>
      </div>

      <div class="details">

        <h3 class="car-name">${car.brand} ${car.model}</h3>

        <div class="price">${money(car.price)}</div>

        <div class="specs">
          <span>${car.year}</span>
          <span>${car.km.toLocaleString("en-IN")} km</span>
          <span>${car.fuel}</span>
          <span>${car.transmission}</span>
        </div>

        <div class="actions">

          <button class="btn view"
            onclick="showDetails(${car.id})">
            View Details
          </button>

          <a class="btn enquire"
            href="${whatsappLink(car)}"
            target="_blank"
            rel="noopener">
            Enquire
          </a>

        </div>

      </div>
    </article>

  `).join("");

}

function showDetails(id) {

  const car = cars.find(c => c.id === id);

  if (!car) return;

  document.getElementById("modalBody").innerHTML = `

    <img src="${car.image}" alt="${car.brand} ${car.model}">

    <h2>${car.brand} ${car.model}</h2>

    <h2 style="color:#1769ff">${money(car.price)}</h2>

    <p><b>Year:</b> ${car.year}</p>
    <p><b>Kilometres:</b> ${car.km.toLocaleString("en-IN")} km</p>
    <p><b>Fuel:</b> ${car.fuel}</p>
    <p><b>Transmission:</b> ${car.transmission}</p>
    <p><b>Colour:</b> ${car.color}</p>

    <p>${car.description}</p>

    <a class="btn enquire"
       href="${whatsappLink(car)}"
       target="_blank"
       rel="noopener">
       Enquire on WhatsApp
    </a>

  `;

  document.getElementById("modal").classList.add("show");

}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("search")
  .addEventListener("input", renderCars);

document.getElementById("fuel")
  .addEventListener("change", renderCars);

document.getElementById("sort")
  .addEventListener("change", renderCars);

document.getElementById("modal")
  .addEventListener("click", event => {
    if (event.target.id === "modal") closeModal();
  });

renderCars();

</script>

</body>
</html>
